spring.application.name=TenderFlow

# --- Database ---
# Local default below; in Docker / Kubernetes override with the environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tenderflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Server Port ===
server.port=8090

# === IdentityService (Feign) ===
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=basic
logging.level.com.Tender.client=DEBUG

# Name of the status that means "open" (must match a row of table tender_status).
# Accounts without permission TENDER_READ_ALL only see tenders in this status.
tenderflow.open-status-name=${TENDERFLOW_OPEN_STATUS_NAME:OPEN}