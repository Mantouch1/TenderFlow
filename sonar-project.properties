# Identité du projet dans SonarQube
sonar.projectKey=TenderFlow
sonar.projectName=TenderFlow
sonar.projectVersion=0.0.1-SNAPSHOT

# Langage et version Java
sonar.language=java
sonar.java.source=17

# Répertoires du code source
sonar.sources=src/main/java
sonar.resources=src/main/resources

# Répertoires des tests
sonar.tests=src/test/java

# Exclusions (fichiers générés, configs, etc.)
sonar.exclusions=**/generated/**,**/config/**,**/*Application.java

# Rapport de couverture (JaCoCo)
sonar.java.coveragePlugin=jacoco
sonar.jacoco.reportPaths=target/jacoco.exec
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Répertoire de build Maven
sonar.java.binaries=target/classes

# Encodage
sonar.sourceEncoding=UTF-8

# Hôte du serveur SonarQube (ex : local ou serveur Docker)
sonar.host.url=http://localhost:9000

# Token d\u2019authentification (à générer dans l\u2019UI de SonarQube)
